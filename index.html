<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主神空间 | Main God Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000;
        color: #e5e5e5;
        font-family: 'Noto Sans SC', sans-serif;
      }
      .font-mono {
        font-family: 'Share Tech Mono', monospace;
      }
      /* Custom scrollbar for the dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #450a0a; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7f1d1d; 
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(220, 38, 38, 0.7);
      }
      .border-glow {
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
      }
      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
      .animate-glitch {
        animation: glitch 0.5s cubic-bezier(.25, .46, .45, .94) both infinite;
      }
    </style>
